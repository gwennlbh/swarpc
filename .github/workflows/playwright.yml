name: End-to-end tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    name: Prepare
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm

      - name: Build and pack package
        run: |
          npm ci
          npm run build
          npm pack

      - name: Build test site
        run: |
          npm add ../swarpc-*.tgz
          npm install 
          npm run build
        working-directory: ./example
      - name: Upload build as artifact
        uses: actions/upload-artifact@v7
        with:
          name: build
          include-hidden-files: true
          path: |
            dist/
            example/build
            example/.svelte-kit
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    name: Test (shard ${{ matrix.shard-index }} of ${{ matrix.shard-count }})
    needs: prepare
    container:
      image: ghcr.io/gwennlbh/playwright-bun:v1.59.1
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shard-index: [1, 2, 3, 4, 5, 6, 7, 8]
        shard-count: [8]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm
      - name: Install dependencies
        run: npm ci && cd example && npm ci
      - name: Download built app
        uses: actions/download-artifact@v8
        with:
          name: build
          path: ./
      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shard-index}}/${{ matrix.shard-count }}
        env:
          SHARDING: "1"
          PLEYE_API_KEY: ${{ secrets.PLEYE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PLEYE_DEBUG: no
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          JOB_ID: ${{ job.check_run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-shard-${{ matrix.shard-index }}
          path: blob-report/
          retention-days: 30

  test-android:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    name: Test (Android Chrome)
    needs: prepare
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 3

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci && cd example && npm ci

      - name: Install Playwright Chromium browser
        run: npx playwright install chromium

      - name: Download built app
        uses: actions/download-artifact@v8
        with:
          name: build
          path: ./

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: android-actions/setup-android@v3

      - name: Install Android emulator components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "emulator" \
            "system-images;android-34;google_apis;x86_64"

      - name: Run Playwright tests on Android Chrome
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_3a
          avd-name: test
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot-save -no-snapshot-load
          # Enable Chrome command-line flags on non-rooted device so Playwright can connect via remote debugging
          # adb reverse makes http://localhost:4173 inside Chrome on the emulator
          # resolve to the preview server running on the CI host
          script: |
            adb shell 'echo "_ --remote-debugging-port=0" > /data/local/tmp/chrome-command-line' &&
            adb reverse tcp:4173 tcp:4173 &&
            npx playwright test --config=playwright.android.config.ts
        env:
          CI: "1"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-android
          path: blob-report/
          retention-days: 30

  combine-reports:
    runs-on: ubuntu-latest
    needs: [test, test-android]
    # run even if tests fail
    if: always()
    environment:
      name: "#${{ github.event.number }}: End-to-end tests report"
      url: ${{ steps.deploy-preview.outputs.preview-url }}
    name: Combine reports
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: ./playwright-report-shards
          pattern: playwright-report-*
          merge-multiple: true

      - name: Merge sharded reports into HTML
        run: npx playwright merge-reports --reporter html ./playwright-report-shards

      - name: Deploy results on github pages
        if: ${{ !cancelled() }}
        id: deploy-preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./playwright-report
          umbrella-dir: _playwright
          comment: false
